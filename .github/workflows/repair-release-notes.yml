name: Repair v1.0.8 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-release-notes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore changelog from annotated tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.8
        shell: bash
        run: |
          set -euo pipefail

          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          notes_file="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$notes_file"
          test -s "$notes_file"

          gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
