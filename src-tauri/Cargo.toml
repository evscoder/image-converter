[package]
name = "imagemag-converter"
version = "1.0.4"
description = "Offline batch image converter for WebP, JPEG and PNG"
authors = ["ImageMAG"]
edition = "2021"

[lib]
name = "imagemag_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"
